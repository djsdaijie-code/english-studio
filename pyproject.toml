[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-typing-trainer"
version = "2.0.0.dev1"
description = "Local Windows desktop app for English reading, typing, AI read-aloud, and review."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.1",
    "fsrs==6.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyInstaller==6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
