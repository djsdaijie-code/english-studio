[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-typing-trainer"
version = "0.2.0.dev0"
description = "Local Windows desktop app for English typing practice."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyInstaller==6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
